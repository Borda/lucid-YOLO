# `pre-commit install` must wire both stages: the trailer validator below runs at
# commit-msg time, and without this it would be installed but never fire.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Generated figures are byte-reproducible from scripts/plot_training.py;
        # rewriting them here would make every regeneration a spurious diff.
        exclude: ^docs/figures/.*\.svg$
      - id: trailing-whitespace
        exclude: ^docs/figures/.*\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        # Core mdformat is CommonMark-only: it parses a GFM table as a paragraph,
        # and --wrap=no would then collapse every row onto one line. The plugin
        # (MIT, like mdformat itself) is what keeps the governance tables intact.
        additional_dependencies: ["mdformat-gfm==1.0.0"]
        # --compact-tables because the alignment padding is charged per column at
        # its widest cell, and ASSUMPTIONS/ROADMAP rows run past 2500 characters:
        # padding them out grew docs/ from 162 kB to 375 kB of trailing spaces.
        args: ["--number", "--wrap=no", "--compact-tables"]
        # pre-commit itself never sees these — they are gitignored working trees — but a
        # save-time hook that formats whatever file was just edited does, and reformatting
        # a 681-line design document to fix one number in it is not a trade anyone chose.
        exclude: ^\.(plans|temp|reports|notes|experiments|cache)/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        pass_filenames: false
      # Scans the installed environment, not the diff, so it must run on every
      # commit: a copyleft dependency can arrive through a transitive bump that
      # touches no tracked file. Costs ~0.24 s over 87 distributions and the 340
      # native libraries they ship; WP-109's binary scan, which walks every wheel's
      # RECORD, is ~0.15 s of that — measured against 0.09 s for the two checks alone.
      - id: license-audit
        name: dependency license audit
        entry: .venv/bin/python scripts/audit_licenses.py
        language: system
        pass_filenames: false
        always_run: true
      # Runs where the contract is actually enforceable. The CI equivalent was
      # dropped: on a squash merge the validated per-commit messages are replaced
      # by the squash message, so CI was checking text that never lands.
      - id: commit-trailers
        name: provenance commit trailers
        entry: .venv/bin/python scripts/check_commit_trailers.py --file
        language: system
        stages: [commit-msg]
