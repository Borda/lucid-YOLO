# `pre-commit install` must wire both stages: the trailer validator below runs at
# commit-msg time, and without this it would be installed but never fire.
default_install_hook_types: [pre-commit, commit-msg]

# pre-commit.ci runs in a bare container: no `.venv`, no editable install of this
# package, and no step that could create either. Every `repo: local` hook below is
# `language: system` with entry `.venv/bin/python`, so every one of them fails there
# with "Executable `.venv/bin/python` not found" -- before running a check. They are
# skipped rather than rewritten because the coverage is not lost: `lint.yml`'s
# `precommit` job builds the venv with uv and runs `pre-commit run --all-files` over
# the same set, which is where these checks are actually enforced. What is left for
# the service is the half it can run unaided -- the hooks whose environments it
# builds itself.
#
# `commit-trailers-history` would mislead there even with an interpreter: the service's
# checkout tracks no upstream and holds no remote-tracking ref, so `--unpushed` falls back
# to `HEAD --not --remotes` and re-validates the whole history the checkout carries.
ci:
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] bump ⬆ suggestions"
  autoupdate_schedule: monthly
  skip:
    - mypy
    - license-audit
    - test-doctest-audit
    - doctest-fences
    - flat-test-group-audit
    - docs-present
    - wp-links
    - docs-site
    - figure-captions
    - license-headers
    - frozen-manifest
    - content-pins
    - version-single-source
    - model-card-figures
    - commit-trailers-history
    - release-guard

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        name: "🔚 fix end of files"
        # Generated figures are byte-reproducible from scripts/plot_training.py;
        # rewriting them here would make every regeneration a spurious diff.
        exclude: ^docs/figures/.*\.svg$
      - id: trailing-whitespace
        name: "🧹 trim trailing whitespace"
        exclude: ^docs/figures/.*\.svg$
      - id: check-yaml
        name: "🧾 check yaml"
        # mkdocs.yml is excluded here and re-checked below: MkDocs loads it with
        # yaml.Loader, and this hook uses safe_load, which cannot construct the
        # `!!python/name:` tag Material's mermaid fence needs.
        exclude: ^mkdocs\.yml$
      - id: check-yaml
        name: "🔓 check yaml (mkdocs, unsafe tags)"
        # --unsafe checks the syntax without constructing objects, so the file is
        # still parsed rather than skipped — which is the half that catches an
        # indentation slip in a 120-line nav.
        args: ["--unsafe"]
        files: ^mkdocs\.yml$
      - id: check-toml
        name: "⚙️ check toml"
      - id: check-added-large-files
        name: "🐘 check for added large files"
        args: ["--maxkb=512"]
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      # Two instances of the same hook, because `docs/` is now published twice: as plain
      # files on GitHub and as a MkDocs Material site, and the second one understands a
      # dialect the first does not. Running the mkdocs plugin over the whole tree would
      # apply that dialect to files no site renders — the README, AGENTS.md, CHANGELOG.md
      # — so each instance is scoped to the surface it actually formats for.
      - id: mdformat
        name: "✏️ mdformat (outside docs/)"
        # Core mdformat is CommonMark-only: it parses a GFM table as a paragraph,
        # and --wrap=no would then collapse every row onto one line. The plugin
        # (MIT, like mdformat itself) is what keeps the governance tables intact.
        additional_dependencies: ["mdformat-gfm==1.0.0"]
        # --compact-tables because the alignment padding is charged per column at
        # its widest cell, and ASSUMPTIONS/ROADMAP rows run past 2500 characters:
        # padding them out grew docs/ from 162 kB to 375 kB of trailing spaces.
        args: ["--number", "--wrap=no", "--compact-tables"]
        # pre-commit itself never sees the dot-dirs — they are gitignored working trees —
        # but a save-time hook that formats whatever file was just edited does, and
        # reformatting a 681-line design document to fix one number in it is not a trade
        # anyone chose. `docs/` is excluded here because the instance below owns it.
        # The pull request template is a commit message, not a document: its four
        # trailer lines are one line each, and a paragraph reflow joins them.
        # Skill entry files require YAML frontmatter; core mdformat would turn it
        # into a Markdown heading, making the skill undiscoverable by Copilot.
        exclude: ^(\.(plans|temp|reports|notes|experiments|cache)/|docs/|\.github/PULL_REQUEST_TEMPLATE\.md$|\.github/skills/[^/]+/SKILL\.md$)
      - id: mdformat
        name: "📚 mdformat (docs/, mkdocs dialect)"
        # mdformat-mkdocs (MIT) formats what the site renders and core mdformat would
        # mangle or flatten: MkDocs-style admonitions, content tabs, and the nested-list
        # indentation Material is sensitive to. It requires mdformat>=1.0.0 and
        # mdformat-gfm>=1.0.0, both of which the pin above already satisfies.
        additional_dependencies: ["mdformat-gfm==1.0.0", "mdformat-mkdocs==5.3.0"]
        args: ["--number", "--wrap=no", "--compact-tables"]
        files: ^docs/
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      # Runs before ruff-format, not after: docformatter rewrites the docstring body and
      # ruff-format then normalizes the quotes and indentation around it, so this order
      # converges in one pass where the reverse leaves ruff's output for the next commit.
      - id: docformatter
        name: "🐍 docformatter (PEP 257 docstrings)"
        # Config lives in [tool.docformatter]; passed explicitly because the hook runs
        # from an isolated environment and `--in-place` is the half that makes it a
        # formatter rather than a checker.
        args: ["--in-place", "--config", "pyproject.toml"]
        # Unpinned, this hook's env is built against whatever `python3` pre-commit
        # resolves off PATH -- which drifted to a 3.10 install on this machine, below
        # this project's own >=3.11 floor, and docformatter's own config reader needs
        # `tomllib` (3.11+) to parse pyproject.toml. Pinned so PATH drift cannot repeat it.
        language_version: python3.11
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        name: "🦀 ruff check"
        args: ["--fix"]
      - id: ruff-format
        name: "🎨 ruff format"
  - repo: local
    hooks:
      - id: mypy
        name: "🧠 mypy (strict)"
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        pass_filenames: false
      # Scans the installed environment, not the diff, so it must run on every
      # commit: a copyleft dependency can arrive through a transitive bump that
      # touches no tracked file. Costs ~0.24 s over 87 distributions and the 340
      # native libraries they ship; WP-109's binary scan, which walks every wheel's
      # RECORD, is ~0.15 s of that — measured against 0.09 s for the two checks alone.
      - id: license-audit
        name: "⚖️ dependency license audit"
        entry: .venv/bin/python scripts/lint/audit_licenses.py
        language: system
        pass_filenames: false
        always_run: true
      # Pure repo content (tests/**/test_*.py, scripts/_tests/test_*.py, and since
      # M-47 the public surface of src/), not installed-environment state, so unlike
      # license-audit this only needs to run when one of those files actually changed
      # rather than on every commit. Split off WP-117 into its own script (WP-129);
      # scripts/_tests/ added in WP-130 when every scripts/-testing file moved out of
      # tests/ to sit beside its subject. src/ carries `*.py` rather than a test glob
      # and counts public functions only -- the Makefile's requirement is about the
      # public surface, and this pattern has to list it or the hook stays silent on
      # exactly the change that drops an Example from a shipped function.
      - id: test-doctest-audit
        name: "📝 doctest coverage over test_*.py helpers and the src/ public surface"
        entry: .venv/bin/python scripts/lint/audit_test_doctests.py
        language: system
        pass_filenames: false
        files: ^(tests/.*/test_[^/]+\.py|scripts/_tests/test_[^/]+\.py|src/.*\.py)$
      # Every docstring doctest under src/ sits in a ```pycon block
      # closed after exactly one blank line. Doctest runs either form, so this
      # holds one convention rather than a correctness property; it is gated
      # because a convention left to review drifted into 14 modules mixing both.
      - id: doctest-fences
        name: "🧱 doctest examples fenced as ```pycon"
        entry: .venv/bin/python scripts/lint/audit_doctest_fences.py
        language: system
        types: [python]
        files: ^src/
      # A confirmed mechanical group (shared name prefix that also names a call
      # target in the file, three or more members) must sit under a
      # `class Test<Subject>:`, tests/eval/test_tile_merge.py's own established
      # pattern -- not a heuristic guess: WP-128's own scope text.
      - id: flat-test-group-audit
        name: "🧩 flat test groups regrouped into classes"
        entry: .venv/bin/python scripts/lint/audit_flat_test_groups.py
        language: system
        pass_filenames: false
        files: ^(tests/.*/test_[^/]+\.py|scripts/_tests/test_[^/]+\.py)$
      # Docs-governance register: every doc a WP's DoD promised actually exists.
      - id: docs-present
        name: "📋 docs governance register presence"
        entry: .venv/bin/python scripts/lint/audit_docs_present.py
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|AGENTS\.md|README\.md)$
      # Every WP-<id> a docs page names links to that WP's page, and each WP page's
      # header (logs, depends on, needed by, neighbours) matches the roadmap (WP-196).
      # Fix with `.venv/bin/python scripts/lint/audit_wp_links.py --fix`.
      - id: wp-links
        name: "🔗 work-package mentions linked, WP headers current"
        entry: .venv/bin/python scripts/lint/audit_wp_links.py
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$
      # MkDocs Material site: nav entries, plugin/extension list, identity fields.
      - id: docs-site
        name: "🗺️ mkdocs site config and nav"
        entry: .venv/bin/python scripts/lint/audit_docs_site.py
        language: system
        pass_filenames: false
        # `notebooks/*.py` is in the pattern because each source owes the nav an entry
        # (WP-188): a notebook added without one is the change this hook has to see.
        files: ^(mkdocs\.yml|docs/.*|pyproject\.toml|\.github/workflows/docs\.yml|notebooks/.*\.py)$
      # A figure's rendered caption text must match the source string that drew it.
      - id: figure-captions
        name: "🖼️ figure caption text matches source"
        entry: .venv/bin/python scripts/lint/audit_figure_captions.py
        language: system
        pass_filenames: false
        files: ^(docs/figures/.*\.svg|docs/REPRODUCTION_REPORT\.md|docs/report/.*\.md)$
      # LICENSE/NOTICE/README wording plus the SPDX header every file under src/,
      # scripts/ and tests/ carries. The checker's scope became a named constant in
      # the same change that widened it past src/ (L-61), so this pattern follows it:
      # a file the checker reads and the hook never fires on is a check that runs
      # only when something else happens to change.
      - id: license-headers
        name: "📄 license and attribution headers"
        entry: .venv/bin/python scripts/lint/audit_license_headers.py
        language: system
        pass_filenames: false
        files: ^(LICENSE|NOTICE|README\.md|(src|scripts|tests|notebooks)/.*\.py)$
      # A notebook is committed as a jupytext `.py` source; the `.ipynb` the site
      # renders is written by `make notebooks` into a gitignored directory (WP-188).
      # `check-added-large-files` does not cover it -- a fresh notebook is small -- and
      # `.gitignore` is not a gate, since `git add -f` walks past it. A stock `fail` hook
      # on the path does the job: pre-commit filters on the *staged* paths, so a forced
      # add matches the pattern at the commit that makes it, and `--all-files` matches
      # every tracked notebook. It needs no interpreter, so pre-commit.ci runs it too.
      - id: no-ipynb-tracked
        name: "📓 no .ipynb tracked (notebooks are .py sources)"
        entry: notebooks are committed as jupytext .py sources; the .ipynb is built by `make notebooks` into a gitignored directory
        language: fail
        files: \.ipynb$
        # `fail` inherits `types: [file]`, which identify tags a symlink as `symlink`, not
        # `file`; an empty list keeps a staged `x.ipynb` symlink in scope.
        types: []
      # Every frozen golden must still be the file the release wrote. The golden
      # harness compares each frozen file against its own stored values, so an edit
      # moving both the values and the tolerances is green there by construction --
      # this is what makes "never modify a frozen golden" (AGENTS.md sec. 7) a check
      # rather than prose. Milliseconds: 34 files, one SHA-256 each.
      #
      # Runs on every commit rather than on a `files:` filter, for the same reason
      # license-audit does: it scans tree state, not the diff. Pre-commit selects
      # staged paths with `--diff-filter=ACMRTUXB`, which omits D, so a commit that
      # only *deletes* a frozen golden matches no filter and would never trigger the
      # one check that notices it is gone.
      - id: frozen-manifest
        name: "🔒 frozen golden digests"
        entry: .venv/bin/python scripts/lint/audit_frozen_manifest.py
        language: system
        pass_filenames: false
        always_run: true
      # Literal content pins that used to run as pytest tests reading files as text:
      # the top-k decoder names no suppression operator, and the packaged recipes
      # leave determinism to the CLI and state their task outside detection.
      - id: content-pins
        name: "📌 content pins on decoder source and packaged configs"
        entry: .venv/bin/python scripts/lint/audit_content_pins.py
        language: system
        pass_filenames: false
        files: ^(src/lucid_yolo/decode/topk_e2e\.py|src/lucid_yolo/configs/[^/]+\.yaml|scripts/lint/audit_content_pins\.py)$
      # pyproject.toml and src/lucid_yolo/__init__.py must name the same version.
      - id: version-single-source
        name: "🔢 package version single source of truth"
        entry: .venv/bin/python scripts/lint/audit_version_single_source.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|src/lucid_yolo/__init__\.py)$
      # Runs where the contract is actually enforceable. The CI equivalent was
      # dropped: on a squash merge the validated per-commit messages are replaced
      # by the squash message, so CI was checking text that never lands.
      - id: commit-trailers
        name: "🏷️ provenance commit trailers"
        entry: .venv/bin/python scripts/lint/check_commit_trailers.py --file
        language: system
        stages: [commit-msg]
      # commit-msg only sees the message being written right now; this is the
      # --all-files-reachable half, re-validating every commit not yet on
      # origin/main.
      #
      # `--unpushed` is `@{upstream}..HEAD`: only local work not yet on the tracked
      # branch; comparing a published PR branch with origin/main would recheck
      # commits whose messages are replaced by the squash merge. Without a
      # resolvable upstream -- a never-pushed branch, or a fork PR checked out by
      # `gh pr checkout`, whose upstream is a URL with no remote-tracking ref -- it
      # falls back to `HEAD --not --remotes` rather than failing to resolve the
      # range. This hook is not the
      # enforcing owner of the contract. The range is empty whenever the branch
      # is already pushed, which is the normal state of a clean tree, so a green
      # run here usually means zero commits were examined rather than that all of
      # them passed. What it does catch is the case it is for: unpushed local
      # work whose messages were written before this hook existed, or amended
      # after commit-msg accepted them. The job that actually gates a
      # contribution is `squash-message` in `pr-message.yml`, over the pull
      # request's title and description -- the message a squash merge lands.
      - id: commit-trailers-history
        name: "📜 provenance commit trailers (unpushed history)"
        entry: .venv/bin/python scripts/lint/check_commit_trailers.py --unpushed
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
      # `stages: [manual]`, not `[pre-commit, manual]`. WP-130b put this on every
      # commit calling it "one already-fast golden recompute"; measured then, it was
      # 34.6 s wall and 65 s CPU, charged to every commit and charged twice per
      # `make gate` -- once here inside `precommit`, once via the `golden`
      # target. `make gate` is the merge bar and runs the harness itself, so the
      # commit-stage copy repeated the gate rather than adding a second opinion,
      # which is what this file is for: linting and quick checks.
      #
      # `lint.yml`'s `--all-files` run was CI's only full sweep, so it did not
      # simply disappear with the stage -- `ci-tests.yml` now runs the harness as
      # its own step, beside the suite it belongs with. Standalone here as before:
      # `pre-commit run --hook-stage manual golden-check`.
      #
      # The cost that decided the stage has since fallen to 7.1 s: 41 of the 50
      # files are frozen copies byte-identical to a live sibling and now reuse that
      # sibling's producer output (M-41). The stage is left where it is anyway. The
      # second argument above is the durable one -- `make gate` runs this harness
      # through its own target, so a commit-stage copy repeats the gate at any
      # price -- and the price is a property of today's golden set, which the next
      # accelerator-backed golden moves straight back up.
      - id: golden-check
        name: "🥇 metric golden regression"
        entry: .venv/bin/python scripts/check_goldens.py
        language: system
        pass_filenames: false
        stages: [manual]
      # `--metadata-only` is what keeps this hook from calling itself. Off a tag
      # it is a no-op either way (`_current_tag` resolves `None` when HEAD is not
      # exactly a tag), so the cost of running it on every `--all-files` is one
      # `git describe`. *On* a tag the no-argument form ran its default gate
      # command, `make gate` — which runs pre-commit, which runs this hook, which
      # asked for another gate: release validation looped instead of reaching the
      # test and build stages, on the one commit where it had a job to do.
      #
      # This is not an exemption from certification. The mode refuses malformed
      # metadata exactly as the full run does, and its passing verdict says in
      # words that no gate ran. `release.yml` invokes the guard without the flag
      # on a tag push, from outside the gate, where running it once is what the
      # flag makes possible.
      - id: release-guard
        name: "🛡️ release tag guard (metadata)"
        entry: .venv/bin/python scripts/release_guard.py --metadata-only
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
      # A test name states the behaviour; these adverbs only lengthen every `-v` line and
      # failure header (AGENTS.md sec. 2). Articles are left out on purpose -- `a` and `the`
      # are too often part of the claim -- and `(\w*_)?` makes the first word after
      # `test_` count as well as a later one, which the shorter `\w*_` form would miss.
      - id: test-name-filler-adverbs
        name: "🪶 no filler adverbs in test names"
        entry: 'def test_(\w*_)?(still|just|actually|properly|correctly)(_|\()'
        language: pygrep
        files: ^(tests|scripts/_tests)/.*\.py$
      # `tqdm.auto` draws the notebook widget where a notebook runs and the terminal bar
      # elsewhere; the plain class always draws the terminal bar. Ruff's `TID251` ban in
      # pyproject.toml covers `src/`, but its per-file ignores exempt exactly these trees, and
      # `src/lucid_yolo/_viz` (exempt for matplotlib) is listed here for the same reason.
      - id: tqdm-auto-only
        name: "📊 progress bars come from tqdm.auto"
        entry: '^\s*(from tqdm import\b|import tqdm\b(?!\.auto\b))'
        language: pygrep
        files: ^(tests|scripts|notebooks|src/lucid_yolo/_viz)/.*\.py$
      # The wiring-gate figure each model card prints must be the one in the golden it
      # cites; the cards were hand-copied and the goldens resealed under them (WP-186).
      - id: model-card-figures
        name: "🃏 model-card wiring-gate figures match their goldens"
        entry: .venv/bin/python scripts/lint/audit_model_card_figures.py
        language: system
        pass_filenames: false
        files: ^(docs/model_cards/.*\.md|goldens/gpu/overfit_micro_.*\.json|scripts/lint/audit_model_card_figures\.py)$
