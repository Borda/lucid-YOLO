# SPDX-License-Identifier: Apache-2.0
name: Release

# Fires on a 0.x version tag (ADR-002 -- no 1.0 is ever tagged). The guard re-runs
# the full gate and refuses the tag if it is red, not `v0.MINOR.PATCH`, or missing
# its CHANGELOG.md section.
#
# Golden freezing (`make freeze-goldens MINOR=0.N`) belongs to the release commit,
# not this workflow: the snapshot is reviewed and committed before the tag is pushed.
# Publication to PyPI is a [PRINCIPAL] decision and is deliberately absent; this
# workflow only builds and uploads the distributions as inspectable artifacts.
#
# `workflow_dispatch` exists because nothing had ever run this file: six releases
# shipped with zero tags. A manual run rehearses the path against the tag naming the
# checked-out tree's own version -- the metadata checks read the working tree, so
# any other version fails before the steps the rehearsal exists to exercise. A
# rehearsal publishes nothing and certifies nothing; it proves the wiring runs.
on:
  push:
    tags:
      - "v0.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse against, e.g. v0.8.0 — must match the checked-out tree's __version__"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The tag reaches every step through the environment, never through the source
    # of a `run:` script: `git check-ref-format` permits `;`, `$` and backticks in
    # a tag name, and `v0.1.0;<command>` matches the trigger above. Passed as
    # `"${TAG}"` it stays one literal argument and fails validation instead -- the
    # pattern `lint.yml` uses for the two PR SHAs.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Full history: the guard re-runs `make gate`, whose pre-commit pass includes
      # `commit-trailers-history` and its `origin/main..HEAD` range; a single-commit
      # checkout has no `refs/remotes/origin/main` and exits 128 on the missing ref.
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # `typing` as well as `dev`: `make gate` runs pre-commit, which runs the
      # `language: system` mypy hook against this venv.
      - name: "🧰 Create venv and install dev extras"
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . --group dev --group typing
      # The certifying invocation, on a tag push only: the gate runs here, once, from
      # outside itself -- the caller the hook's metadata-only mode exists for.
      - name: "🛡️ Release guard (re-runs the full gate)"
        if: github.event_name == 'push'
        run: .venv/bin/python scripts/release_guard.py --tag "${TAG}"
      # Same five metadata checks, no gate: `lint.yml` and `ci-tests.yml` already ran
      # it over this commit, and a third run is what would stop a rehearsal from
      # reaching the two steps below.
      - name: "🛡️ Release guard (metadata only — rehearsal, certifies nothing)"
        if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/release_guard.py --tag "${TAG}" --metadata-only
      # README.md is the PyPI long description, and PyPI resolves relative links
      # against pypi.org, so figures and docs links are pinned to this tag first.
      # The checkout is disposable, so the rewrite is not reverted.
      - name: "🔗 Pin README links to the tag being released"
        run: .venv/bin/python scripts/absolutize_readme.py --ref "${TAG}"
      - name: "🏗️ Build sdist and wheel"
        run: uv build --out-dir dist
      # A rehearsal's distributions are named apart: they are built from the
      # dispatch branch, not the tree a tag names, and an artifact indistinguishable
      # from a release build will eventually be treated as one.
      - name: "📤 Upload distributions as artifacts"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lucid-yolo-${{ env.TAG }}${{ github.event_name == 'workflow_dispatch' && '-rehearsal' || '' }}
          path: dist/*
          if-no-files-found: error
