# SPDX-License-Identifier: Apache-2.0
name: CI Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, strict mypy and the copyleft audit live in lint.yml, whose `trailers` job
  # checks the pull request's own commits (WP-144); a squash merge replaces the
  # messages a check here would read. The matrix covers every `requires-python`
  # interpreter on both CPU platforms; before it only 3.11 on Linux ever ran.
  # `UV_TORCH_BACKEND: cpu` stops each cell from downloading a CUDA torch wheel.
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every cell reports: one failing interpreter is a finding, and cancelling
      # its siblings hides whether the others agree.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_TORCH_BACKEND: "cpu"
    steps:
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: "🧰 Create venv and install the dev dependency group"
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e . --group dev
      # `make test`, not inline pytest: the inline line omitted `--doctest-modules`
      # and `src scripts`, so CI collected 1548 tests where the Makefile collects
      # 2668 -- every `scripts/_tests/` check and some 879 doctests never ran here.
      # The Makefile's `PY` is `.venv/bin/python`, the venv created above.
      - name: "🧪 Offline unit suite with coverage (make test)"
        run: make test
      # Frozen golden sweep. WP-162 took `golden-check` off the commit stage, and
      # `lint.yml`'s `--all-files` run had been CI's only full sweep. It lives here
      # because the harness recomputes model metrics: a test-shaped check.
      #
      # One cell only: the values were frozen on Linux under 3.11, and the
      # tolerances are sized for code drift, not interpreter or BLAS drift.
      - name: "🥇 Frozen golden regression"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: .venv/bin/python scripts/check_goldens.py

  # One check name for the matrix. Branch protection names checks, and a cell's name
  # carries its coordinates (`testing (macos-latest, 3.13)`): requiring cells means
  # editing the rule whenever the matrix changes, and an unlisted red cell does not
  # block the merge. `if: always()` makes this a guardian rather than a rubber stamp:
  # without it a skipped or cancelled matrix skips this job too, and a skipped
  # required check counts as passing. Both results fail here on purpose.
  testing-guardian:
    permissions: {}
    runs-on: ubuntu-latest
    needs: testing
    if: always()
    steps:
      - name: "📋 Report the matrix result"
        env:
          RESULT: ${{ needs.testing.result }}
        run: echo "testing matrix result ${RESULT}"
      - name: "❌ Fail on a failed cell"
        if: needs.testing.result == 'failure'
        run: exit 1
      - name: "⏭️ Fail on a cancelled or skipped matrix"
        if: contains(fromJSON('["cancelled", "skipped"]'), needs.testing.result)
        run: exit 1
