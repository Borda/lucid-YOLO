# SPDX-License-Identifier: Apache-2.0
name: CI Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linting, strict typing and the copyleft audit live in lint.yml; the commit-trailer
  # contract is a local pre-commit check here, because a squash merge replaces the
  # messages this workflow would have validated. WP-144 narrowed that: the argument
  # covers the merge result and not the submission, so lint.yml's `trailers` job checks
  # the pull request's own commits, which are what review actually reads.
  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Create venv and install the dev dependency group
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . --group dev
      - name: Offline unit suite with coverage
        run: .venv/bin/python -m pytest -m "not gpu and not data" --cov=lucid_yolo --cov-report=term
