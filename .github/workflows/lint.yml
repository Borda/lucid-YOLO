# SPDX-License-Identifier: Apache-2.0
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything the local `.git/hooks/pre-commit` runs, over the whole tree rather
  # than the staged diff: ruff check and format, strict mypy, the hygiene hooks,
  # and the copyleft dependency audit.
  #
  # This is also the only place the twelve `repo: local` hooks run in CI. They are
  # listed under `ci: skip:` in `.pre-commit-config.yaml` because pre-commit.ci
  # cannot run them -- its container has no `.venv` for their `language: system`
  # entries to resolve, and no step that could build one -- so every one of them
  # failed there before checking anything. That key is pre-commit.ci's alone; the
  # `pre-commit` CLI ignores it, so the run below still executes the full set.
  precommit:
    runs-on: ubuntu-latest
    env:
      UV_TORCH_BACKEND: "cpu"
    steps:
      # Full history, for the same reason the `dco` and `trailers` jobs below ask
      # for it: `pre-commit run --all-files` includes `commit-trailers-history`,
      # whose entry is `--range origin/main..HEAD`. The default single-commit
      # checkout creates no `refs/remotes/origin/main`, so that range does not
      # resolve and the hook exits 128 with a Git error — the job would fail
      # before linting a line, and the failure would name a missing ref rather
      # than anything about the submission.
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # `typing` as well as `dev`: the mypy hook is `language: system` with entry
      # `.venv/bin/python -m mypy`, so it resolves the interpreter this step installs
      # into rather than an environment pre-commit manages. Without the group the hook
      # fails with `No module named mypy` -- which is what it did after the 0.8.0
      # release commit dropped the declaration.
      - name: "🧰 Create venv and install the dev and typing dependency groups"
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . --group dev --group typing
      # `--all-files`, not the staged diff, and with no `SKIP` in the environment: this
      # runs the remote hooks and the twelve local ones together, which is the full set
      # a commit sees on a laptop.
      - name: "🔍 Run pre-commit (all linters + strict mypy + local audit hooks)"
        run: .venv/bin/pre-commit run --all-files

  # Admission layer one (WP-142): every commit a contributor submits carries its own
  # `Signed-off-by`. Pull requests only -- a push to `main` has no contributor range to
  # check, and this repository's own history predates the requirement, so running it
  # there would refuse every existing commit rather than any submitted one.
  #
  # The check is a file in this repository rather than a hosted app, so it runs the same
  # way on a laptop and here, and it survives whatever happens to that service. It needs
  # no environment beyond the standard library, which is why this job installs nothing.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: the range spans the pull request's own commits, and a shallow
      # clone cannot walk back to its base.
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # The two SHAs go through the environment rather than into the command string:
      # they are interpolated from event data, and a value reaching a shell directly is
      # how that becomes an injection rather than a range.
      - name: "✍️ Check Developer Certificate of Origin sign-offs"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/lint/check_dco.py --range "${BASE_SHA}..${HEAD_SHA}"

  # Admission layer three (WP-144), and the only one producing a reviewable artifact
  # rather than a promise: a contributor must name what an algorithmic change derives
  # from, so an unnamed derivation on a loss or an assigner is visible at review instead
  # of after release.
  #
  # `ci-tests.yml` skips this, correctly, for what lands on `main`: a squash merge
  # replaces the messages it would have validated, so checking them there validates a
  # message nobody wrote. That argument covers the merge result and not the submission.
  # The contributor's own commits are exactly what review reads, and they exist here.
  trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "🏷️ Check provenance trailers on the pull request's own commits"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/lint/check_commit_trailers.py --range "${BASE_SHA}..${HEAD_SHA}"
