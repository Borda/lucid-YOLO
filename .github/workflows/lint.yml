# SPDX-License-Identifier: Apache-2.0
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR pushes cancel; pushes to main never do, and each gets its own group
# (run_id) so a queued main run is not replaced by the next one either.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything the local pre-commit hook runs, over the whole tree: ruff check and
  # format, strict mypy, the hygiene hooks and the copyleft audit.
  #
  # Also the only place every `repo: local` hook runs in CI. They sit under
  # `ci: skip:` in `.pre-commit-config.yaml` because pre-commit.ci has no `.venv`
  # for their `language: system` entries, so each failed there before checking
  # anything. The `pre-commit` CLI ignores that key, so the run below is the full set.
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_TORCH_BACKEND: "cpu"
      # `commit-trailers-history` validates `origin/main..HEAD`: on a pull request
      # those are branch commits a squash merge never lands, and on a push to `main`
      # the range is empty. The message that lands is checked by pr-message.yml.
      # Skipped here, the hook stays a laptop check and this job needs no full history.
      SKIP: commit-trailers-history
    steps:
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🐍 Set up Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # `typing` as well as `dev`: the mypy hook is `language: system` with entry
      # `.venv/bin/python -m mypy`, so mypy must be in this venv. Without the group
      # it fails with `No module named mypy`, as it did after the 0.8.0 release
      # commit dropped the declaration.
      - name: "🧰 Create venv and install the dev and typing dependency groups"
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . --group dev --group typing
      # `--all-files`: remote and local hooks together, the set a laptop commit sees
      # minus the one hook skipped above.
      - name: "🔍 Run pre-commit (all linters + strict mypy + local audit hooks)"
        run: .venv/bin/pre-commit run --all-files

  # Admission layer one, the DCO sign-off, is the DCO GitHub App's status, not a job
  # here: `check_dco.py` and the `dco` job (WP-142) were removed when the app was
  # installed. Admission layer three, the provenance trailers, is pr-message.yml:
  # this workflow's `trailers` job validated a pull request's own commits, and a
  # squash-only repository never lands those.

  # The workflow audits (actionlint, zizmor) are the `workflows` job in ci-tests.yml:
  # branch protection requires `testing-guardian`, and only jobs that guardian
  # `needs` can turn it red.
