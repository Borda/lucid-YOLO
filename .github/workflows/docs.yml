name: Docs

# Builds the MkDocs Material site on every pull request and publishes it to the
# `gh-pages` branch on push to the default branch. `mkdocs build --strict` fails on a
# link to a missing page and on a page the nav never lists -- the two ways this site
# rots.
#
# Publishing is a branch deploy, not the Pages artifact flow it was until WP-188:
# `ghp-import` commits `site/` onto `gh-pages` on top of that branch's history (a plain
# push, never forced) and Pages serves the branch. One branch then carries the site and
# the generated notebooks -- each `notebooks/<name>.py` source is converted to
# `.ipynb` here and copied to `site/notebooks/<name>.ipynb`, and the Colab badge on
# every notebook page opens `blob/gh-pages/notebooks/<name>.ipynb`, because Colab's
# GitHub loader reads a file by branch path and `main` holds no `.ipynb` by design (D25).
#
# Serving the branch is a one-time operator step, deliberately not automated:
# Settings -> Pages -> Source "Deploy from a branch", branch `gh-pages`, folder
# `/ (root)`. Until then a push run publishes the branch and nothing serves it; the
# badge still resolves, since it reads the branch and not the site.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR builds cancel; a push to main never does, as in release.yml: a
  # half-finished publish is worse than a queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Read-only. Installs the whole docs dependency tree (mkdocs-material and what it
  # pulls), so it must not hold a write token: that was the grant this job carried
  # until K4, when the publish step lived here. A pull request and a push run the same
  # steps; a push also hands the built site to `publish` as an artifact.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: "🧰 Create venv and install the docs dependency group"
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python --group docs
      # The docs group is in no other workflow, so this is the only place CI sees
      # the tree mkdocs-material pulls. The audit scans the installed environment
      # (D15/D16), so it runs where the exposure enters.
      - name: "⚖️ Dependency license audit over the docs environment"
        run: .venv/bin/python scripts/lint/audit_licenses.py
      # Mirrors the Makefile's `notebooks` target line for line; the existence test
      # is what makes an empty `notebooks/` a no-op rather than a jupytext error on
      # the literal `notebooks/*.py`. `--from py:percent` keeps the sources' `# !cmd`
      # lines shell lines in the published `.ipynb`; the Makefile says why the guesser
      # cannot be trusted with them.
      - name: "📓 Convert the notebook sources to .ipynb"
        run: |
          mkdir -p docs/notebooks
          for src in notebooks/*.py; do
            [ -e "$src" ] || continue
            .venv/bin/python -m jupytext --from py:percent --to ipynb --output "docs/notebooks/$(basename "$src" .py).ipynb" "$src"
          done
      - name: "🏗️ Build the site (strict)"
        run: .venv/bin/python -m mkdocs build --strict
      # `include_source` already places a copy at `site/notebooks/<name>/<name>.ipynb`
      # beside the rendered page; this copy is the flat `site/notebooks/<name>.ipynb`
      # the badge URL names. Done on pull requests too, now that build is shared: it
      # is a cheap copy and keeps the two paths identical.
      - name: "📎 Copy the converted notebooks to the badge path"
        run: |
          mkdir -p site/notebooks
          for nb in docs/notebooks/*.ipynb; do
            [ -e "$nb" ] || continue
            cp "$nb" site/notebooks/
          done
      - name: "📤 Hand the built site to the publish job"
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 1

  # The only job with a write grant, and the only one that touches the token: it runs
  # on a push to the default branch, never on a pull request, and installs nothing
  # from the docs tree -- `ghp-import` alone, pinned. The trade-off K4 reopened: the
  # earlier comment kept one job to avoid handing the site across an artifact. That
  # costs a ~30 s extra job and an artifact hop, and in exchange the write token is
  # no longer exposed to ~100 third-party docs packages' install and build code, nor
  # to a same-repo pull request's build at all.
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # `ghp-import` parents its commit on `refs/remotes/origin/gh-pages` -- absent from
      # a shallow single-branch checkout, in which case it starts a fresh root, which
      # is the non-fast-forward the remote rejected on the second publish.
      # `fetch-depth: 0` fetches every branch, so the parent is there; on the first
      # publish, before the branch exists, the import still starts a root and the push
      # creates it. Credentials persist here on purpose: `ghp-import -p` pushes with
      # the checkout's token, and this is the one checkout that may.
      - name: "📥 Check out the repository with every branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] the publish push below needs it
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: "📥 Fetch the built site"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      # `-n` writes `.nojekyll` so Pages serves Material's underscore-prefixed assets;
      # `-p` pushes; the commit lands on top of `gh-pages` history -- `-f` is never
      # passed. The bot identity is the one `commit-trailers-history` already exempts
      # by address; a build-product commit has no provenance to name. `ghp-import` is
      # the tool mkdocs ships, pinned to the 2.1.0 the docs group resolves. If a branch
      # ruleset ever blocks pushes from `GITHUB_TOKEN`, this step fails at the push and
      # says so -- an operator step, like the Pages source above, and not one this file
      # works around.
      - name: "🚀 Publish site/ to the gh-pages branch"
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx ghp-import==2.1.0 -n -p -m "docs: build ${COMMIT_SHA}" site
