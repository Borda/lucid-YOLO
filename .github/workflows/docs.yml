# SPDX-License-Identifier: Apache-2.0
name: Docs

# Builds the MkDocs Material site on every pull request and deploys it to GitHub
# Pages on push to the default branch. `mkdocs build --strict` fails on a link to a
# missing page and on a page the nav never lists -- the two ways this site rots.
#
# Enabling Pages is a one-time operator step (Settings -> Pages -> Source: GitHub
# Actions), deliberately not automated: `configure-pages` runs without `enablement`,
# so it reports a misconfigured repository rather than changing one. Until then the
# push-to-main run fails at `configure-pages`; pull-request runs never reach it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # Not cancel-in-progress, as in release.yml: a half-finished deployment is worse
  # than a queue.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Replaces the top-level block. `pages: read` is what `configure-pages` needs;
    # its `enablement` input defaults to false and would need a token other than
    # `GITHUB_TOKEN` anyway, so read is the ceiling, not a denied permission.
    permissions:
      contents: read
      pages: read
    steps:
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: "🧰 Create venv and install the docs dependency group"
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python --group docs
      # The docs group is in no other workflow, so this is the only place CI sees
      # the tree mkdocs-material pulls. The audit scans the installed environment
      # (D15/D16), so it runs where the exposure enters.
      - name: "⚖️ Dependency license audit over the docs environment"
        run: .venv/bin/python scripts/lint/audit_licenses.py
      - name: "🏗️ Build the site (strict)"
        run: .venv/bin/python -m mkdocs build --strict
      # Skipped on pull requests: it fails when Pages is not enabled, which no PR can
      # fix. On push it is the early, legible failure for that state.
      - name: "⚙️ Configure Pages"
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: "📤 Upload the built site as a Pages artifact"
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Job-level permissions replace the top-level block, so both are named here.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
