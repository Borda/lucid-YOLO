# SPDX-License-Identifier: Apache-2.0
name: Accelerator Gate

# The schedule the Makefile's `gate-gpu` comment claimed to be. The marked tests and
# the goldens/gpu/ subtree need an accelerator, so nothing ran them unless a human
# remembered -- which is how the detection overfit golden drifted for six days under
# WP-078; docs/RESEARCH_LOG.md still lists shapes_regression_det.json as outstanding.
#
# Arming it is one repository action: set the variable GPU_RUNNER_LABEL to the label
# of a self-hosted CUDA runner (e.g. `gpu-cuda`). Until then both triggers resolve
# to a visible skipped job rather than a run queued forever. GitHub-hosted runners
# have no GPU, so there is no default worth hard-coding.
#
# Nightly, not per-push: the L4 reference run costs ~915 s for the marked tests and
# retrains the same pipeline again for the goldens; drift caught within a day is
# the point.

on:
  schedule:
    # 04:17 UTC: off the hour, because scheduled runs queue behind the top-of-hour
    # spike.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-gpu-${{ github.workflow }}-${{ github.ref }}
  # Never cancel: a half-finished training run leaves no signal about the goldens.
  cancel-in-progress: false

jobs:
  gate-gpu:
    if: vars.GPU_RUNNER_LABEL != ''
    runs-on: ${{ vars.GPU_RUNNER_LABEL }}
    # ~2x the L4 reference, with room for a cold checkout and a first install.
    timeout-minutes: 90
    steps:
      - name: "📥 Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🐍 Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: "📦 Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: "🧰 Create venv and install the dev dependency group"
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e . --group dev
      - name: "🖥️ Report the accelerator the gate is about to run on"
        run: |
          nvidia-smi || echo "nvidia-smi unavailable"
          .venv/bin/python -c "import torch; print('cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')"
      # `make gate-gpu` is `test-gpu` then `golden-gpu`: the marked tests assert the
      # WP-040/087/088/132 floors, the goldens the frozen values. The transcript is
      # tee'd, not recomputed: every producer retrains a model, so a second pass
      # would cost another gate and could disagree with the first. `pipefail` keeps
      # the gate's exit status, not tee's, as the verdict.
      - name: "⚡ Accelerator gate (marked tests + goldens/gpu regression)"
        run: |
          set -o pipefail
          mkdir -p .reports/gate-gpu
          make gate-gpu 2>&1 | tee .reports/gate-gpu/gate.log
      - name: "📤 Upload the run record"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-gpu-${{ github.run_id }}
          path: .reports/gate-gpu/
          if-no-files-found: warn
