# SPDX-License-Identifier: Apache-2.0
# Overfit-100 integration recipe (WP-040): the loss must be driven toward zero on
# a fixed ~100-image slice, proving the full train loop (model + dual loss + MuSGD
# + ProgLoss) wires end to end. n-scale, tiny epoch budget, mosaic disabled from
# epoch 0 (close_mosaic == max_epochs) so the fit sees a stationary target, and a
# single fixture-style split reused for train and val. ADR-001: topology is named
# by `variant` only and lives in lucid_yolo/models/registry.py.
seed_everything: 0

# Registry row, not a topology (ADR-001). Expands via scale_spec() onto the
# module's depth/width/max_channels and the datamodule augmentation policy.
variant: n

trainer:
  max_epochs: 40 # tiny budget: enough steps to memorize the fixed slice
  # determinism: CLI default (default_determinism) — strict on CPU/CUDA, warn_only on MPS
  gradient_clip_val: 10.0 # A31: bounds the violent opening steps of the from-scratch recipe
  num_sanity_val_steps: 0
  callbacks:
    # close_mosaic == max_epochs disables mosaic from epoch 0: overfit needs a
    # stationary target, not fresh four-image composites every sample.
    - class_path: lucid_yolo.ptl.callbacks.CloseMosaicCallback
      init_args:
        close_mosaic: 40

model:
  num_classes: 80 # COCO 2017 (R12); matches the fixture annotation space
  lr: 0.01 # blueprint sec. 5.8 (R1 Tables S2/S5): lr0
  lrf: 1.0 # A8 schedule OFF (with warmup_epochs 0): overfit memorizes at constant LR; golden frozen pre-WP-072
  warmup_epochs: 0
  momentum: 0.95 # blueprint sec. 5.8: momentum ~0.94-0.95
  weight_decay: 0.0005 # blueprint sec. 5.8: weight_decay 5e-4
  box_gain: 7.5 # blueprint sec. 5.7 (R1 Tables S2/S5): pretrain-style box gain
  cls_gain: 0.5 # blueprint sec. 5.7: cls gain
  l1_gain: 6.0 # blueprint sec. 5.7: L1 gain (the legacy dfl field scales L1)
  alpha_init: 0.8 # blueprint sec. 5.7 (R1 Eq. 2-3): ProgLoss ramp start, weights (0.8, 0.2)
  alpha_final: 0.1 # blueprint sec. 5.7: ProgLoss ramp end, weights (0.1, 0.9)

data:
  # PLACEHOLDER paths -- WP-040 points these at the generated fixture slice
  # (A26 synthetic stand-in, tests/fixtures/_generated). One Roboflow-style split
  # is reused for train and val via the datamodule's explicit-path overrides, so
  # data_root itself is unused here.
  data_root: /path/to/fixture_slice
  batch_size: 4 # PLACEHOLDER -- small slice, small batch
  num_workers: 0 # 0 gives byte-identical deterministic epochs (single seeded generator)
  train_images_dir: /path/to/fixture_slice/images
  train_ann_file: /path/to/fixture_slice/annotations.json
  val_images_dir: /path/to/fixture_slice/images
  val_ann_file: /path/to/fixture_slice/annotations.json
