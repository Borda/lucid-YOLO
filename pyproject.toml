[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-yolo"
# Single source of truth: src/lucid_yolo/__init__.py. setuptools reads the attribute
# statically (a plain string literal needs no import), so building never imports torch.
dynamic = ["version"]
description = "Independent, from-scratch PyTorch Lightning implementation of the real-time detection, instance-segmentation, oriented-detection, and keypoint-detection methods described in the YOLO26 paper (arXiv:2606.03748)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jirka Borovec" }]
keywords = ["object-detection", "instance-segmentation", "oriented-detection", "pytorch-lightning", "reproduction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "pytorch-lightning[extra]>=2.4",
  # Declared directly, not leaned on transitively: LightningCLI brings it, but all three
  # console scripts parse with it now (WP-096), and `[signatures]` is what reads the
  # docstrings the help text is built from.
  "jsonargparse[signatures]>=4.28",
  "torchvision>=0.19",
  "torchmetrics>=1.9",
  "faster-coco-eval>=1.7",
  # `lucid-eval`'s bbox/segm scoring engine by default (WP-138) -- faster-coco-eval
  # stays required too: keypoints' OKS scoring, module.py's training-loop val/mAP,
  # and lucid-eval's own explicit --eval_backend faster_coco_eval rollback all use
  # it directly, and this project never asks a caller to install a second package
  # just to get the report it already had. Tight ceiling deliberate, not
  # conventional: three of the five known hotcoco/torchmetrics compatibility traps
  # (docs/ASSUMPTIONS.md A73) fail silently rather than raising, so each pre-1.0
  # minor needs re-verifying against tests/eval/test_coco_eval.py::TestHotcocoParity
  # before it is allowed in -- the same reasoning rf-detr PR 1402 states for its
  # own identical ceiling.
  "hotcoco>=0.5,<0.6",
  "fvcore>=0.1.5",
  "pyyaml>=6.0",
  # Declared directly for the same reason as jsonargparse: Lightning brings it for the
  # training progress bar, and `lucid-data build-tiles` draws its own (WP-100).
  "tqdm>=4.66",
  "numpy>=1.26",
  # Promoted from the `dev` group at WP-159, because Phase 14 made it one: five modules
  # under `data/` import it at module level, so `lucid_yolo.data` -- and `predict`, through
  # `letterbox` -- cannot import without it, and leaving it in a group meant an install
  # without that group produced a package that fails on import rather than one missing an
  # optional extra. ADR-005 gates promotion on four conditions and the first of them,
  # real SemVer releases to PyPI, is **knowingly not met**: PyPI's latest is `0.10.0.dev0`,
  # it carries no 0.11 or 0.12 at all, and the capability floor this project stands on is
  # `a5a276a`. A direct-reference requirement is legal to build and install and illegal to
  # upload, so this pin makes the distribution unpublishable to PyPI -- accepted by the
  # principal on 2026-09-04 (D20, docs/ESCALATION.md) on the grounds that publication is
  # itself an unmade [PRINCIPAL] decision that `release.yml` deliberately omits, so the
  # condition protects nothing this project currently does. The SHA is the ceiling
  # condition 2 asks for, being exact rather than a range. Revisit the day a 0.12 reaches
  # PyPI: the fix is a `>=0.12,<0.13` range and nothing else here changes.
  "fuse-augmentations @ git+https://github.com/Borda/fuse-augmentations@a5a276addf38e2dfd80ecaf287b2328445e545a6",
]

# PEP 735 dependency group, not a `[project.optional-dependencies]` extra: these
# packages exist only to build, lint and test the project, and an extra would
# publish them in the wheel's metadata as something a consumer could install.
# Install with `uv pip install -e . --group dev` (see the Makefile setup target).
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-doctestplus>=1.3",
  "shapely>=2.0",
  "pre-commit>=3.7",
  "build>=1.2",
  # `scripts/lint/audit_licenses.py` imports it directly for marker and extras evaluation:
  # attributing a distribution to a dependency tier means walking the requirement graph
  # the way an installer would, and a hand-rolled marker evaluator would be a second,
  # worse implementation of a solved problem. Arrived transitively before WP-115 (pytest
  # and mkdocs both require it, which is why the docs CI job has it without this line);
  # declared here because a direct import is not a transitive dependency. Apache-2.0 OR
  # BSD-2-Clause, read from the installed distribution's own `License-Expression`.
  "packaging>=24.0",
  # `fuse-augmentations` was declared here until WP-159 promoted it to a runtime
  # dependency; the reasoning for the commit pin, and for the PyPI condition it fails,
  # moved with it to `[project].dependencies`.
  "matplotlib>=3.8",
  # WP-066's export gate only. The export itself is `torch.onnx.export`, already a
  # runtime dep, so nothing a consumer installs changes: `onnx` reads the emitted
  # graph back to assert what is in it, and `onnxruntime` executes it to assert the
  # exported model still answers what the checkpoint answers. Both Apache-2.0/MIT.
  "onnx>=1.17",
  "onnxruntime>=1.19",
]
# The type checker and its stub packages, separate from `dev` because only one job
# needs them: `pre-commit` runs mypy as a `language: system` hook whose entry is
# `.venv/bin/python -m mypy`, so mypy has to be installed into this project's own
# environment rather than into a hook environment pre-commit manages. The linting
# job installs this group; the test job does not, and nothing under `make test`
# imports mypy.
#
# The split exists because leaving it implicit already broke once. The 0.8.0 release
# commit dropped `ruff>=0.6` and `mypy>=1.11` from `dev` together, and only mypy
# failed: ruff's hook comes from the `ruff-pre-commit` repository with its own managed
# environment, so removing the declaration changed nothing, while mypy's `language:
# system` hook resolves the interpreter this group installs into. A fresh `make setup`
# and every lint CI run reported `No module named mypy`; a developer tree that already
# had it kept passing, which is why it reached CI to be found. `pathspec` is MPL-2.0
# and arrives here, through mypy -- the licence-audit comment below names it.
typing = [
  "mypy>=1.11",
  "types-PyYAML",
  "types-tqdm",
]
# Deliberately not folded into `dev`, and deliberately not part of `make setup`: the
# site is a publishing toolchain, `mkdocs build` is not a merge gate, and nothing in
# `make gate` imports either package. A contributor who never builds the site never
# installs the tree. Install with `uv pip install --python .venv/bin/python --group docs`;
# doing so also brings the tree under the pre-commit licence audit, which scans the
# environment rather than the diff. Both packages are permissive (mkdocs BSD-2-Clause,
# mkdocs-material MIT) and the tree they pull clears that audit — measured, not assumed.
# One transitive is not permissive and is named rather than buried: `certifi` is
# MPL-2.0, weak file-level copyleft, reached through mkdocs-material -> requests. It is
# not what the audit bans (AGPL/GPL/LGPL) and MPL-2.0 is already in this environment
# via `pathspec`, which arrives with mypy; it is recorded here because a licence claim
# nobody can check is the failure D15 and D16 exist to prevent.
#
# `mkdocs<2` is a licence bound, not a compatibility one. Building the site prints a
# notice from the Material team about the MkDocs 2.0 release, one line of which is
# "Currently unlicensed - unsuitable for production use". This project admits permissive
# licences only, and an unlicensed dependency is not one: the default is no grant at all,
# which is stricter than the AGPL the audit bans. And the audit would not catch it:
# `scripts/lint/audit_licenses.py` matches a GPL-family pattern against what a distribution
# declares, so a distribution declaring nothing matches nothing and passes silently. The
# cap is what keeps that resolution from happening in the first place. Lift it when
# 2.x ships a permissive LICENSE, verified from the repository rather than from the notice.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]

[project.scripts]
lucid-yolo = "lucid_yolo.cli.train:main"
lucid-data = "lucid_yolo.cli.data:main"
lucid-eval = "lucid_yolo.cli.eval:main"
lucid-predict = "lucid_yolo.cli.predict:main"

[project.urls]
# The canonical slug, not the one this checkout's remote still uses. GitHub redirects a
# renamed repository's HTML URLs, so a stale slug looks fine in a browser; raw.github-
# usercontent.com does not redirect, so the packaging rewrite that builds figure URLs
# from this line would ship a page whose every image 404s. Verified against the GitHub
# API, which reports full_name `Borda/lucid-YOLO` for the old path.
Homepage = "https://github.com/Borda/lucid-YOLO"

[tool.setuptools.dynamic]
version = { attr = "lucid_yolo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lucid_yolo = ["py.typed", "configs/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "PL",        # pylint
  "C90",       # mccabe complexity
  "RUF",       # ruff-specific
]
ignore = [
  "PLR2004",   # magic values in tests / tensor shapes are idiomatic
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
# scripts/_tests/ carries the same monkeypatch/spec-loaded-module character as tests/,
# which this config has never held to strict typing -- excluded for the same reason.
exclude = ["^scripts/_tests/"]
mypy_path = "src:."
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["faster_coco_eval.*", "fvcore.*", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib avoids the bare-basename collision two non-package conftest.py roots
# (tests/, scripts/_tests/) would otherwise hit under the default prepend mode --
# each gets a module identity keyed on its full path instead of its file stem.
addopts = [
  "-ra",
  "--strict-markers",
  "--import-mode=importlib",
  "--doctest-plus",
  "--color=yes",
  "--capture=sys",
]
markers = [
  "gpu: needs an accelerator (MPS/CUDA); excluded from offline unit gate",
  "data: needs a generated or real dataset on disk",
]

[tool.coverage.run]
source = ["lucid_yolo"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.docformatter]
# PEP 257 normalization only: quote placement, the blank line before a closing triple
# quote, the period a one-line summary ends with, trailing whitespace inside the body.
# Deliberately not a re-flow of the prose.
#
# `wrap-descriptions = 0` disables description wrapping, and that is the load-bearing
# setting here rather than a timid one. This project's docstrings carry argued paragraphs,
# `**bold**` lead-ins, and Google-style `Args:`/`Returns:` blocks whose indentation is what
# Napoleon parses; re-flowing them to a column would run those blocks together and rewrite
# hand-chosen line breaks across the whole tree in a commit nobody could review. Summaries
# are wrapped, at the same 120 columns ruff-format uses, because a summary is one sentence
# by construction and has no structure to lose.
wrap-summaries = 0
wrap-descriptions = 0
# Words that open a summary as an identifier rather than as English. PEP 257 wants a
# capitalized sentence, and every entry here is a name whose spelling is not this file's
# to change: the distribution, a subpackage, a third-party library. `Lucid-yolo` names
# nothing that exists.
non-cap = [
  # The distribution and its subpackages, named as modules rather than as English.
  "lucid-yolo:",
  "assign",
  "data",
  "decode",
  "eval",
  "heads",
  "losses",
  "models",
  "optim",
  "ptl",
  # Third-party names and API surface a summary opens with. `Empty()` and `Backward()`
  # name no method that exists, and `MAP` is a different thing from `mAP`.
  "torchmetrics",
  "empty()",
  "backward()",
  "mAP",
  # Symbols and abbreviations from the papers and the code they describe.
  "rboxes[i]",
  "rkeep",
  "rgb",
  "o2o",
  "p=0",
  "total",
  "lrf",
]
# The blank line before a closing `"""` on a multi-line docstring is PEP 257's own
# convention and is what this repository already writes; stated so the hook does not have
# to infer it from the first file it sees.
pre-summary-newline = false
close-quotes-on-newline = true
