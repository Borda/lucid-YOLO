<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
  <title id="t">How the detector turns an image into boxes</title>
  <desc id="d">An image passes through a backbone and neck that produce feature grids at strides 8, 16 and 32. Two parallel heads read the grids: a dense one-to-many head that shapes training and feeds the optional NMS path, and a one-to-one head that is deployed. Its scores are ranked, the top 300 are kept, and the result is one box per object.</desc>
  <style>
    :root { --bg:#f7f8fb; --ink:#1c2333; --mute:#8a93a6; --acc:#3f51b5; --soft:#dfe4f5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1b2030; --ink:#e6e9f2; --mute:#7d869a; --acc:#8c9eff; --soft:#2b3350; } }
    text { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .sub { font-size: 11.5px; fill: var(--mute); }
    .lab { font-size: 13px; font-weight: 600; }
    .box { fill: var(--soft); stroke: var(--acc); stroke-width: 1.5; }
    .dashed { fill: none; stroke: var(--mute); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .grid { stroke: var(--acc); stroke-width: .8; opacity: .55; }
    .obj { fill: var(--mute); opacity: .55; }
    .arrow { fill: none; stroke: var(--acc); stroke-width: 1.8; marker-end: url(#head); }
    .mute-arrow { fill: none; stroke: var(--mute); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .det { fill: none; stroke: var(--acc); stroke-width: 2.5; }
    .stage { animation: lit 10s infinite backwards; }
    .s2 { animation-delay: 2s; } .s3 { animation-delay: 4s; } .s4 { animation-delay: 6s; } .s5 { animation-delay: 8s; }
    .det { animation: pop 10s infinite backwards; animation-delay: 8s; }
    @keyframes lit { 0% { opacity:.22 } 5% { opacity:1 } 21% { opacity:1 } 26% { opacity:.22 } 100% { opacity:.22 } }
    @keyframes pop { 0% { opacity:0 } 6% { opacity:1 } 30% { opacity:1 } 40% { opacity:0 } 100% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) { .stage, .det { animation: none; opacity: 1; } }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--acc)"/></marker>
    <pattern id="g8" width="8" height="8" patternUnits="userSpaceOnUse"><path class="grid" d="M8 0V8M0 8H8"/></pattern>
    <pattern id="g16" width="16" height="16" patternUnits="userSpaceOnUse"><path class="grid" d="M16 0V16M0 16H16"/></pattern>
    <pattern id="g32" width="32" height="32" patternUnits="userSpaceOnUse"><path class="grid" d="M32 0V32M0 32H32"/></pattern>
  </defs>
  <rect width="900" height="330" rx="10" fill="var(--bg)"/>

  <g class="stage s1">
    <rect x="20" y="95" width="120" height="120" rx="4" class="box"/>
    <rect x="38" y="122" width="38" height="52" rx="4" class="obj"/>
    <rect x="86" y="150" width="40" height="46" rx="4" class="obj"/>
    <text x="80" y="245" text-anchor="middle" class="lab">image</text>
    <text x="80" y="262" text-anchor="middle" class="sub">640 × 640</text>
  </g>
  <path class="arrow" d="M144 155H182"/>

  <g class="stage s2">
    <rect x="190" y="70" width="120" height="48" class="box"/>
    <rect x="190" y="70" width="120" height="48" fill="url(#g8)"/>
    <rect x="190" y="132" width="120" height="48" class="box"/>
    <rect x="190" y="132" width="120" height="48" fill="url(#g16)"/>
    <rect x="190" y="194" width="120" height="48" class="box"/>
    <rect x="190" y="194" width="120" height="48" fill="url(#g32)"/>
    <text x="320" y="98" class="sub">stride 8</text>
    <text x="320" y="160" class="sub">stride 16</text>
    <text x="320" y="222" class="sub">stride 32</text>
    <text x="250" y="266" text-anchor="middle" class="lab">backbone + neck</text>
    <text x="250" y="283" text-anchor="middle" class="sub">three feature grids</text>
  </g>
  <path class="arrow" d="M375 140H398"/>

  <g class="stage s3">
    <rect x="400" y="62" width="210" height="76" rx="6" class="dashed"/>
    <text x="505" y="90" text-anchor="middle" class="lab">one-to-many head</text>
    <text x="505" y="108" text-anchor="middle" class="sub">dense · shapes training</text>
    <text x="505" y="124" text-anchor="middle" class="sub">feeds the optional NMS path</text>
    <rect x="400" y="170" width="210" height="76" rx="6" class="box"/>
    <text x="505" y="198" text-anchor="middle" class="lab">one-to-one head</text>
    <text x="505" y="216" text-anchor="middle" class="sub">sparse · deployed</text>
    <text x="505" y="232" text-anchor="middle" class="sub">one score per anchor</text>
  </g>
  <path class="arrow" d="M612 208H652"/>

  <g class="stage s4">
    <rect x="655" y="170" width="105" height="76" rx="6" class="box"/>
    <text x="707" y="196" text-anchor="middle" class="lab">top-k</text>
    <text x="707" y="213" text-anchor="middle" class="sub">rank by score</text>
    <text x="707" y="229" text-anchor="middle" class="sub">keep 300</text>
  </g>
  <path class="arrow" d="M762 208H792"/>

  <g class="stage s5">
    <rect x="795" y="160" width="90" height="90" rx="4" class="box"/>
    <rect x="806" y="178" width="26" height="36" rx="3" class="obj"/>
    <rect x="842" y="200" width="30" height="34" rx="3" class="obj"/>
    <rect x="802" y="173" width="34" height="46" rx="2" class="det"/>
    <rect x="838" y="195" width="38" height="44" rx="2" class="det"/>
    <text x="840" y="275" text-anchor="middle" class="lab">boxes</text>
    <text x="840" y="292" text-anchor="middle" class="sub">no suppression step</text>
  </g>
  <text x="450" y="318" text-anchor="middle" class="sub">Illustrative sketch of the data path, not measured output.</text>
</svg>
