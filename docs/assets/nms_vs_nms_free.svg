<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
  <title id="t">Post-processing with NMS and without it</title>
  <desc id="d">Left: the NMS path scores many overlapping candidate boxes per object, sorts them, and removes every box that overlaps a better one above an IoU threshold. Right: the NMS-free path ranks the one-to-one branch's scores and keeps the top k, with no overlap computation, because the branch was trained to emit one box per object.</desc>
  <style>
    :root { --bg:#f7f8fb; --ink:#1c2333; --mute:#8a93a6; --acc:#3f51b5; --soft:#dfe4f5; --bad:#d6455d; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1b2030; --ink:#e6e9f2; --mute:#7d869a; --acc:#8c9eff; --soft:#2b3350; --bad:#ff7a8f; } }
    text { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .sub { font-size: 11.5px; fill: var(--mute); }
    .lab { font-size: 14px; font-weight: 600; }
    .scene { fill: var(--soft); stroke: var(--acc); stroke-width: 1.2; }
    .obj { fill: var(--mute); opacity: .5; }
    .keep { fill: none; stroke: var(--acc); stroke-width: 2.6; }
    .dup { fill: none; stroke: var(--mute); stroke-width: 1.6; stroke-dasharray: 5 3; animation: dup 12s infinite; }
    .cross { stroke: var(--bad); stroke-width: 2.4; animation: cross 12s infinite; }
    .step { opacity: .3; animation: step 12s infinite; }
    .a { animation-delay: 0s; } .b { animation-delay: 4s; } .c { animation-delay: 8s; }
    .score { font-size: 12px; font-weight: 600; fill: var(--acc); }
    @keyframes dup { 0%,38% { opacity:1; stroke: var(--mute) } 50% { opacity:1; stroke: var(--bad) } 62%,92% { opacity:0 } 100% { opacity:1; stroke: var(--mute) } }
    @keyframes cross { 0%,45% { opacity:0 } 52%,62% { opacity:1 } 70%,100% { opacity:0 } }
    @keyframes step { 0% { opacity:.3 } 3%,30% { opacity:1 } 34%,100% { opacity:.3 } }
    @media (prefers-reduced-motion: reduce) { .dup, .cross, .step { animation: none; } .dup { opacity: .0 } .cross { opacity: 0 } .step { opacity: 1 } }
  </style>
  <rect width="900" height="400" rx="10" fill="var(--bg)"/>
  <line x1="450" y1="20" x2="450" y2="380" stroke="var(--mute)" stroke-opacity=".4"/>

  <!-- left: NMS -->
  <text x="225" y="34" text-anchor="middle" class="lab">With NMS — one-to-many branch</text>
  <rect x="25" y="50" width="400" height="210" rx="6" class="scene"/>
  <rect x="65" y="90" width="100" height="120" rx="6" class="obj"/>
  <rect x="285" y="120" width="100" height="95" rx="6" class="obj"/>
  <rect class="dup" x="57" y="82" width="112" height="132"/>
  <rect class="dup" x="73" y="94" width="96" height="122"/>
  <rect class="dup" x="60" y="100" width="116" height="104"/>
  <rect class="dup" x="277" y="112" width="112" height="108"/>
  <rect class="dup" x="293" y="126" width="98" height="92"/>
  <rect class="keep" x="62" y="86" width="108" height="128"/>
  <rect class="keep" x="281" y="116" width="108" height="102"/>
  <text x="66" y="80" class="score">0.91</text>
  <text x="285" y="110" class="score">0.88</text>
  <g class="cross"><path d="M150 100l14 14M164 100l-14 14"/><path d="M365 134l14 14M379 134l-14 14"/></g>
  <g>
    <text class="step a" x="30" y="292">1  sort every candidate by score</text>
    <text class="step b" x="30" y="314">2  drop boxes overlapping a better one (IoU over threshold)</text>
    <text class="step c" x="30" y="336">3  keep what is left, at most 300</text>
  </g>
  <text x="30" y="370" class="sub">Needs an IoU threshold, and a pairwise overlap computation.</text>

  <!-- right: NMS-free -->
  <text x="675" y="34" text-anchor="middle" class="lab">NMS-free — one-to-one branch</text>
  <rect x="475" y="50" width="400" height="210" rx="6" class="scene"/>
  <rect x="515" y="90" width="100" height="120" rx="6" class="obj"/>
  <rect x="735" y="120" width="100" height="95" rx="6" class="obj"/>
  <rect class="keep" x="512" y="86" width="108" height="128"/>
  <rect class="keep" x="731" y="116" width="108" height="102"/>
  <text x="516" y="80" class="score">0.91</text>
  <text x="735" y="110" class="score">0.88</text>
  <g>
    <text class="step a" x="480" y="292">1  score every anchor; trained to fire once per object</text>
    <text class="step b" x="480" y="314">2  rank by score</text>
    <text class="step c" x="480" y="336">3  keep the top 300 — no overlap test</text>
  </g>
  <text x="480" y="370" class="sub">Fixed (300, 6) output, nothing data-dependent to trace or export.</text>
</svg>
