# MkDocs Material site over the existing docs/ tree (WP-114).
#
# The site publishes what is already in the repository; it owns no prose of its own
# beyond docs/index.md. Every register stays a plain markdown file a reader can open
# on GitHub without this toolchain, which is why nothing here rewrites content and
# why no plugin generates a page from a docstring or a template. The one derived
# surface is the notebooks (WP-188, D25): `make notebooks` converts each committed
# `notebooks/<name>.py` jupytext source into `docs/notebooks/<name>.ipynb`, gitignored,
# and mkdocs-jupyter renders that file unexecuted -- the source cells and the Colab
# badge, no outputs. The prose is still the repository's; only the file format is not.
#
# Since D28 (WP-196) some pages are assembled rather than held: the research and
# engineering phase pages include each work package's file from docs/work_packages/,
# and the model cards and the NMS page include the report's result tables, through
# pymdownx.snippets. Every piece of text is still a plain markdown file on GitHub;
# what reads there as a bare `--8<--` line is a page whose text lives in the file it names.
#
# The build also derives, and never stores, what search engines and agents read first
# (WP-196): scripts/docs_site_hooks.py gives each page a distinct title and description
# (from its H1 and first paragraph, a WP page from its roadmap row), writes a markdown
# copy of every page at <page>/index.md with includes resolved, and writes llms.txt and
# llms-full.txt at the site root; overrides/main.html renders the metadata.
#
# Identity fields are read off pyproject.toml rather than restated: site_name is the
# distribution name, site_description its description verbatim, repo_url its Homepage.
# site_url is the one derived value — GitHub Pages serves a project site at
# <owner>.github.io/<repo>/ and nothing in the repository states it.
#
# Loaded with yaml.Loader by MkDocs (mkdocs/utils/yaml.py), which is what makes the
# !!python/name: tag below resolvable. pre-commit's check-yaml reads the same file
# with safe_load and cannot construct that tag, so .pre-commit-config.yaml excludes
# this file from the default instance and re-checks it with --unsafe: syntax still
# validated, objects not constructed.

site_name: lucid-yolo
site_description: Independent, from-scratch PyTorch Lightning implementation of the real-time detection, instance-segmentation, oriented-detection, and keypoint-detection methods described in the YOLO26 paper (arXiv:2606.03748)
site_url: https://borda.github.io/lucid-YOLO/
site_author: Jirka Borovec
copyright: Copyright 2026 Jirka Borovec — Apache-2.0 (see LICENSE and NOTICE)

repo_url: https://github.com/Borda/lucid-YOLO
repo_name: Borda/lucid-YOLO
# Explicit because the default is edit/master/docs/, and this repository's default
# branch is main: every edit link would 404 on a value nothing else here would catch.
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  # main.html renders the per-page title, description, Open Graph tags and JSON-LD that
  # the build hook below derives (WP-196).
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    # Top-level nav entries become a tab bar; the left sidebar then lists only the
    # pages of the active tab instead of every register at once (WP-196).
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  # Naming any plugin replaces the default list, so search is restated rather than
  # inherited — omitting it silently ships a site whose search box finds nothing.
  - search
  # Renders the `.ipynb` files `make notebooks` writes under docs/notebooks/. Never
  # executes them: docs CI is torch-free and the site is not where a notebook is
  # proven to run — `tests/notebooks/test_notebooks_run.py` is (fast, under `make
  # test`; full, under `make test-gpu`). `include_source` puts a download link to the
  # `.ipynb` on the page; `ignore_h1_titles` keeps the nav label below as the page
  # title rather than the notebook's own first heading, matching every other page.
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            show_source: false
            heading_level: 3

# Wider grid and a right-hand table of contents that slides in from the edge (WP-196).
extra_css:
  - stylesheets/extra.css

# Strips `>>>`/`...` prompts and output lines when a ```pycon example is copied.
extra_javascript:
  - javascripts/pycon_copy.js

# Per-page titles and descriptions, a markdown copy of every page at <page>/index.md, and
# llms.txt / llms-full.txt at the site root -- all derived at build time (WP-196).
hooks:
  - scripts/docs_site_hooks.py

markdown_extensions:
  # tables is a default that a user-supplied markdown_extensions list does not
  # inherit, and this repository is wall-to-wall GFM tables: the assumption
  # register, the roadmap and every acceptance table render as pipe-soup without
  # it, on a build that reports success. Listed here, and asserted in
  # tests/meta/test_docs_site.py rather than trusted to stay listed.
  - tables
  - attr_list
  - def_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      # `language-pycon` on each block is what javascripts/pycon_copy.js keys on.
      pygments_lang_class: true
  - pymdownx.superfences:
      # Material renders a fence tagged mermaid as a diagram only when superfences
      # hands it through as a div of that class; the format callable is what does
      # the handing. No ```mermaid fence exists in docs/ today — this makes the
      # first one that lands render instead of printing as literal source.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # One file per work package under docs/work_packages/ (WP-196): the research and
  # engineering phase pages include each WP's sections by name, so a finding is
  # written once. Section markers sit inside HTML comments, invisible on GitHub;
  # the include lines themselves show there as plain `--8<--` text. check_paths
  # turns a missing file into a build error instead of an empty section.
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

# Work-package pages are reached from the roadmap rows and the phase pages that
# include them; listing ~160 of them in the sidebar would bury every other page.
not_in_nav: |
  /work_packages/*.md

validation:
  # Verified against mkdocs 1.6's own defaults (mkdocs/config/defaults.py), not
  # assumed: four of the six settings below are raised from `info` to `warn` —
  # nav `omitted_files`, and links `absolute_links`, `unrecognized_links`,
  # `anchors`. `omitted_files` is the one that motivated this block: a page
  # missing from the nav is reachable only by search or by guessing its URL,
  # which for a register nobody knows exists is indistinguishable from not
  # publishing it. The two `not_found` settings already default to `warn` and are
  # restated rather than raised, so the whole policy reads in one place and an
  # upstream defaults change cannot quietly relax it. Every `warn` here becomes an
  # error under `mkdocs build --strict`, which is what `make docs` runs.
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  # Tabs group what a reader does, not what a file is called: the guide tab holds every
  # short section (its pages sit in the left menu), the report and model cards each get a
  # tab, and the project's own bookkeeping goes last (WP-196).
  - Home:
      - Overview: index.md
      - Method:
          - How the detector works: method/how-it-works.md
          - NMS versus NMS-free: method/nms-vs-nms-free.md
      - Run it:
          - Launching a training run: TRAINING.md
          - Provisioning the datasets: DATASETS.md
      - Clean-room:
          - Provenance: PROVENANCE.md
          - Assumptions: ASSUMPTIONS.md
          - Decisions: DECISIONS.md
  - Results:
      - Overview: REPRODUCTION_REPORT.md
      # `v0.X.0: topic`, the release each section landed in. The two correcting notes
      # landed after v0.8.0 and belong to no release yet; they sit in a nested, and so
      # collapsible, Unreleased group (a sidebar top-level group never collapses).
      - Releases:
          - "v0.1.0: Detection": report/detection.md
          - "v0.2.0: Instance segmentation": report/segmentation.md
          - "v0.3.0: Oriented detection": report/oriented-detection.md
          - "v0.4.0: Consolidated note": report/consolidated-note.md
          - "v0.5.0: Keypoints": report/keypoints.md
          - Unreleased:
              - "Correction, scoring engine": report/correction-scoring-engine.md
              - "Correction, keypoint sources": report/correction-keypoint-sources.md
  - Models:
      - Model cards:
          - Detection: model_cards/detection.md
          - Instance segmentation: model_cards/segmentation.md
          - Oriented detection: model_cards/obb.md
          - Keypoints: model_cards/keypoints.md
      # One entry per `notebooks/<name>.py` source, as `- <Title>: notebooks/<name>.ipynb`
      # (WP-188): the `.ipynb` is what `make notebooks` writes, and
      # `scripts/lint/audit_docs_site.py` resolves the entry against the `.py` source, so
      # the nav is valid on a checkout that has never run the converter.
      - Notebooks:
          - Development gates: notebooks/development_gates.ipynb
          - Detection on COCO 2017: notebooks/demo_detect.ipynb
          - Instance segmentation on COCO 2017: notebooks/demo_segment.ipynb
          - Oriented detection on DOTA tiles: notebooks/demo_obb.ipynb
          - Keypoints on COCO person_keypoints: notebooks/demo_keypoints.ipynb
  - API:
      - Models: api/models.md
      - Data: api/data.md
      - Training: api/training.md
      - Inference: api/inference.md
  - Project:
      - Roadmap: ROADMAP.md
      - Logs:
          - Research log: RESEARCH_LOG.md
          - Engineering log: ENGINEERING_LOG.md
          - Cross-cutting engineering: engineering/cross-cutting.md
          - Escalation log: ESCALATION.md
      # Phase first, as the roadmap numbers them; each phase lists the log pages it has.
      - Phases:
          - Phase 0 — Foundation:
              - Engineering: engineering/phase-00-foundation.md
          - Phase 1 — Data pipeline:
              - Research: research/phase-01-data-pipeline.md
          - Phase 2 — Architecture:
              - Research: research/phase-02-architecture.md
          - Phase 3 — Assignment and losses:
              - Research: research/phase-03-assignment-and-losses.md
          - Phase 4 — MuSGD:
              - Research: research/phase-04-musgd.md
          - Phase 5 — Lightning training loop:
              - Research: research/phase-05-training-loop.md
              - Engineering: engineering/phase-05-training-loop.md
          - Phase 6 — Evaluation, v0.1.0:
              - Research: research/phase-06-evaluation.md
              - Engineering: engineering/phase-06-evaluation.md
          - Phase 7 — Instance segmentation, v0.2.0:
              - Research: research/phase-07-instance-segmentation.md
          - Phase 8 — Oriented detection, v0.3.0:
              - Research: research/phase-08-oriented-detection.md
              - Engineering: engineering/phase-08-oriented-detection.md
          - Phase 9 — Inference and generalization:
              - Research: research/phase-09-inference.md
              - Engineering: engineering/phase-09-inference.md
          - Phase 10 — Consolidation, v0.4.0, then rolling:
              - Research: research/phase-10-consolidation.md
              - Engineering: engineering/phase-10-consolidation.md
          - Phase 11 — Rolling, toward v0.5.0:
              - Engineering: engineering/phase-11-rolling.md
          - Phase 12 — Keypoint detection, v0.5.0:
              - Research: research/phase-12-keypoints.md
              - Engineering: engineering/phase-12-keypoints.md
          - Phase 13 — Contributor admission, augmentation guard and keypoint parity, v0.6.0:
              - Engineering: engineering/phase-13-contributor-admission.md
          - Phase 14 — Augmentation upstreaming to fuse, v0.7.0:
              - Engineering: engineering/phase-14-augmentation-upstreaming.md
          - Phase 15 — Audit remediation, v0.8.0:
              - Engineering: engineering/phase-15-audit-remediation.md
          - Phase 16 — Training throughput:
              - Engineering: engineering/phase-16-training-throughput.md
          - Phase 17 — R1 pose-objective parity:
              - Engineering: engineering/phase-17-pose-objective-parity.md
          - Phase 18 — Codebase audit remediation:
              - Engineering: engineering/phase-18-codebase-audit.md
      - Contributor guide: CONTRIBUTING.md
